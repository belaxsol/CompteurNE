# Site statique (dossier site/) + fonctions pour l'image de partage (netlify/functions/)
[build]
  publish = "site"
  command = ""
  # Le bot commite les données toutes les 15 min : on ne redéploie que si le site ou les fonctions changent
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify/ netlify.toml package.json package-lock.json"

[functions]
  node_bundler = "esbuild"
  # Module natif (rendu PNG) : installé tel quel plutôt que regroupé par esbuild
  external_node_modules = ["@resvg/resvg-js"]

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
